name: Deploy ReaBili to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_community:
        description: "Verify public sharing with two temporary identities, then withdraw both recommendations"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript and data
        run: |
          node --check dist/app.js
          node --check dist/community.js
          node --check community-api/worker.js
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -v
      - name: Verify public community API from a second network
        if: inputs.check_community || contains(github.event.head_commit.message, '[pilot-smoke]')
        run: |
          api_base=$(node --input-type=module -e "import { PRODUCTION_API } from './dist/community-config.js'; console.log(PRODUCTION_API)")
          node scripts/check-community.mjs "$api_base" --write
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
